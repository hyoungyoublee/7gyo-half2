<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A1A2E"/>
      <stop offset="60%"  stop-color="#16213E"/>
      <stop offset="100%" stop-color="#0F3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 배경 원 장식 -->
  <circle cx="1050" cy="100" r="220" fill="rgba(255,215,0,0.05)"/>
  <circle cx="150"  cy="530" r="160" fill="rgba(255,215,0,0.04)"/>
  <circle cx="1100" cy="550" r="120" fill="rgba(255,255,255,0.03)"/>

  <!-- 골드 사이드 라인 -->
  <rect x="0" y="0" width="8" height="630" fill="url(#gold)"/>

  <!-- 상단 eyebrow -->
  <text x="80" y="185" font-family="'Noto Sans KR', Arial, sans-serif" font-size="28" font-weight="700"
    fill="rgba(255,215,0,0.75)" letter-spacing="8">2026 교회 봉사표</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="295" font-family="'Noto Sans KR', Arial, sans-serif" font-size="110" font-weight="900"
    fill="#FFFFFF" letter-spacing="-4" filter="url(#glow)">7교구</text>
  <text x="80" y="295" font-family="'Noto Sans KR', Arial, sans-serif" font-size="110" font-weight="900"
    fill="url(#gold)" letter-spacing="-4">7교구</text>

  <!-- 서브 타이틀 -->
  <text x="80" y="390" font-family="'Noto Sans KR', Arial, sans-serif" font-size="62" font-weight="700"
    fill="rgba(255,255,255,0.9)" letter-spacing="-1">하반기 봉사 일정</text>

  <!-- 골드 언더라인 -->
  <rect x="80" y="410" width="420" height="4" rx="2" fill="url(#gold)"/>

  <!-- 배지들 -->
  <!-- 국수봉사 -->
  <rect x="80"  y="460" width="150" height="48" rx="24" fill="rgba(76,175,80,0.2)" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="155" y="491" font-family="Arial, sans-serif" font-size="24" fill="#81C784" text-anchor="middle">🍜 국수봉사</text>

  <!-- 헌금위원 -->
  <rect x="248" y="460" width="150" height="48" rx="24" fill="rgba(33,150,243,0.2)" stroke="#2196F3" stroke-width="1.5"/>
  <text x="323" y="491" font-family="Arial, sans-serif" font-size="24" fill="#64B5F6" text-anchor="middle">💰 헌금위원</text>

  <!-- 이동목욕 -->
  <rect x="416" y="460" width="150" height="48" rx="24" fill="rgba(255,152,0,0.2)" stroke="#FF9800" stroke-width="1.5"/>
  <text x="491" y="491" font-family="Arial, sans-serif" font-size="24" fill="#FFB74D" text-anchor="middle">🛁 이동목욕</text>

  <!-- 성전청소 -->
  <rect x="584" y="460" width="150" height="48" rx="24" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="659" y="491" font-family="Arial, sans-serif" font-size="24" fill="#CE93D8" text-anchor="middle">🧹 성전청소</text>

  <!-- 엘리스카페 -->
  <rect x="752" y="460" width="170" height="48" rx="24" fill="rgba(233,30,99,0.2)" stroke="#E91E63" stroke-width="1.5"/>
  <text x="837" y="491" font-family="Arial, sans-serif" font-size="24" fill="#F48FB1" text-anchor="middle">☕ 엘리스카페</text>

  <!-- 우측 큰 숫자 장식 -->
  <text x="1120" y="370" font-family="Arial, sans-serif" font-size="260" font-weight="900"
    fill="rgba(255,215,0,0.06)" text-anchor="middle">7</text>

  <!-- 하단 라인 -->
  <rect x="0" y="610" width="1200" height="2" fill="rgba(255,215,0,0.3)"/>
  <text x="1180" y="625" font-family="Arial, sans-serif" font-size="20"
    fill="rgba(255,255,255,0.3)" text-anchor="end">hyoungyoublee.github.io/7gyo-half2</text>
</svg>
