<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7교구 하반기 봉사 일정 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #F0EEE9;
    font-family: 'Noto Sans KR', sans-serif;
    color: #1A1A1A;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(160deg, #1A1A2E 0%, #16213E 60%, #0F3460 100%);
    color: #fff;
    padding: 44px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content:''; position:absolute; top:-60px; right:-60px;
    width:220px; height:220px; border-radius:50%;
    background:rgba(255,215,0,0.06);
  }
  .header::after {
    content:''; position:absolute; bottom:-40px; left:-40px;
    width:160px; height:160px; border-radius:50%;
    background:rgba(255,215,0,0.04);
  }
  .eyebrow {
    font-size:11px; letter-spacing:5px; color:rgba(255,215,0,0.7);
    text-transform:uppercase; margin-bottom:12px; font-weight:500;
  }
  .h-title {
    font-size:36px; font-weight:900; letter-spacing:-1.5px; line-height:1.1;
    color:#fff;
  }
  .h-title span { color:#FFD700; }
  .h-badge {
    display:inline-block; margin-top:14px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    border-radius:999px; padding:5px 16px;
    font-size:12px; color:rgba(255,255,255,0.8); letter-spacing:1px;
  }

  /* ── 총 봉사 요약 ── */
  .summary {
    display:flex; gap:10px; padding:20px 16px 4px;
    overflow-x:auto; scrollbar-width:none;
  }
  .summary::-webkit-scrollbar { display:none; }
  .summary-chip {
    flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    background:#fff; border-radius:14px; padding:12px 16px;
    border:1.5px solid #E8E4DE; min-width:72px;
    box-shadow:0 1px 4px rgba(0,0,0,.04);
  }
  .summary-icon { font-size:22px; margin-bottom:4px; }
  .summary-count { font-size:18px; font-weight:900; line-height:1; }
  .summary-label { font-size:10px; color:#999; margin-top:3px; font-weight:500; }

  /* ── Section ── */
  .section { padding:24px 16px 0; }
  .section-header {
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .section-month {
    font-size:28px; font-weight:900; letter-spacing:-1px; color:#1A1A1A;
  }
  .section-dot {
    flex:1; height:1px; background:#DDD9D3;
  }
  .section-count {
    font-size:11px; color:#bbb; font-weight:600;
  }

  /* ── Card ── */
  .card {
    background:#fff; border-radius:18px;
    border:1.5px solid #E8E4DE;
    margin-bottom:10px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    cursor:pointer; transition:transform .15s, box-shadow .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .card:active { transform:scale(.98); box-shadow:none; }
  .card-inner { display:flex; align-items:stretch; min-height:76px; }
  .card-accent { width:6px; flex-shrink:0; border-radius:0 0 0 0; }
  .card-body {
    flex:1; padding:16px 14px 16px 18px;
    display:flex; align-items:center; gap:14px;
  }
  .card-icon-wrap {
    width:46px; height:46px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0;
  }
  .card-info { flex:1; }
  .card-service { font-size:13px; font-weight:700; margin-bottom:3px; }
  .card-date { font-size:19px; font-weight:900; letter-spacing:-0.5px; line-height:1.1; }
  .card-note { font-size:12px; color:#999; margin-top:3px; }
  .card-arrow { font-size:20px; color:#DDD; padding-right:2px; }

  /* service colors */
  .c-국수봉사 { background:#4CAF50; }
  .c-헌금위원 { background:#2196F3; }
  .c-이동목욕 { background:#FF9800; }
  .c-성전청소 { background:#9C27B0; }
  .c-엘리스카페 { background:#E91E63; }

  .ic-국수봉사 { background:#E8F5E9; }
  .ic-헌금위원 { background:#E3F2FD; }
  .ic-이동목욕 { background:#FFF3E0; }
  .ic-성전청소 { background:#F3E5F5; }
  .ic-엘리스카페 { background:#FCE4EC; }

  .t-국수봉사 { color:#2E7D32; }
  .t-헌금위원 { color:#1565C0; }
  .t-이동목욕 { color:#E65100; }
  .t-성전청소 { color:#6A1B9A; }
  .t-엘리스카페 { color:#C2185B; }

  /* ── Modal ── */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,.6); z-index:100;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:#fff; border-radius:28px 28px 0 0;
    width:100%; max-width:480px; padding:0 0 48px;
    animation:slideUp .28s cubic-bezier(.16,1,.3,1);
  }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-handle { width:40px; height:4px; background:#E0E0E0; border-radius:2px; margin:16px auto 0; }
  .modal-top {
    display:flex; align-items:center; gap:14px;
    padding:20px 24px 16px; border-bottom:1px solid #F0EDE8;
  }
  .modal-icon { font-size:36px; }
  .modal-info {}
  .modal-title { font-size:22px; font-weight:900; }
  .modal-date  { font-size:14px; color:#888; margin-top:2px; }
  .modal-note  { font-size:13px; color:#aaa; margin-top:1px; }

  .modal-sec { padding:16px 24px 0; font-size:11px; letter-spacing:2px; color:#bbb; font-weight:700; text-transform:uppercase; }
  .modal-actions { padding:10px 24px 0; display:flex; flex-direction:column; gap:8px; }
  .modal-btn {
    display:flex; align-items:center; gap:14px;
    padding:15px 18px; border-radius:16px;
    border:1.5px solid #EEEBE6; background:#FAFAF8;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
    text-align:left; text-decoration:none; transition:background .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .modal-btn:active { background:#F0EDE8; }
  .modal-btn-icon { font-size:24px; width:34px; text-align:center; flex-shrink:0; }
  .modal-btn-label { font-size:14px; font-weight:700; color:#1A1A1A; }
  .modal-btn-sub   { font-size:11px; color:#aaa; margin-top:1px; }
  .modal-cancel {
    margin:12px 24px 0; padding:15px; border-radius:16px;
    border:none; background:#F0EDE8;
    font-family:'Noto Sans KR',sans-serif; font-size:15px;
    font-weight:700; color:#888; cursor:pointer;
    width:calc(100% - 48px); display:block;
  }

  /* ── 클릭 유도 ── */
  .card.has-detail {
    border-color:#C8C3BB;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
  }
  .card.has-detail .card-inner {
    background:linear-gradient(to right, #FDFCFB, #F7F4F0);
  }
  .expand-hint {
    display:flex; align-items:center; gap:4px;
    font-size:10px; font-weight:700; color:#fff;
    background:#1A1A1A; border-radius:999px;
    padding:3px 9px; margin-top:5px; white-space:nowrap;
  }
  .card-note-wrap { display:flex; flex-direction:column; align-items:flex-start; }

  /* ── Detail 세부 목록 ── */
  .detail-wrap {
    display:none; padding:0 16px 16px 16px;
    border-top:1px dashed #E8E4DE; background:#FAF8F5;
  }
  .detail-wrap.open { display:block; }
  .detail-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; margin-top:8px;
    background:#fff; border-radius:12px;
    border:1.5px solid #EEEBE6;
  }
  .detail-date { font-size:14px; font-weight:700; color:#1A1A1A; }
  .detail-group {
    font-size:12px; font-weight:700;
    padding:3px 10px; border-radius:999px;
  }
  /* 서비스별 배지 색 */
  .dg-엘리스카페 { color:#C2185B; background:#FCE4EC; }
  .dg-이동목욕   { color:#E65100; background:#FFF3E0; }

  /* Toast */
  .toast {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(16px);
    background:#1A1A1A; color:#fff; padding:11px 24px;
    border-radius:999px; font-size:13px; font-weight:600;
    opacity:0; transition:all .3s; pointer-events:none; z-index:999; white-space:nowrap;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="eyebrow">2026 교회 봉사표</div>
  <div class="h-title"><span>7교구</span> 하반기 봉사</div>
  <div class="h-badge">7월 ~ 12월 · 담당 사역 일정</div>
</div>

<!-- 요약 칩 -->
<div class="summary">
  <div class="summary-chip">
    <div class="summary-icon">🍜</div>
    <div class="summary-count">1</div>
    <div class="summary-label">국수봉사</div>
  </div>
  <div class="summary-chip">
    <div class="summary-icon">💰</div>
    <div class="summary-count">1</div>
    <div class="summary-label">헌금위원</div>
  </div>
  <div class="summary-chip">
    <div class="summary-icon">🛁</div>
    <div class="summary-count">1</div>
    <div class="summary-label">이동목욕</div>
  </div>
  <div class="summary-chip">
    <div class="summary-icon">🧹</div>
    <div class="summary-count">1</div>
    <div class="summary-label">성전청소</div>
  </div>
  <div class="summary-chip">
    <div class="summary-icon">☕</div>
    <div class="summary-count">2</div>
    <div class="summary-label">엘리스카페</div>
  </div>
</div>

<div id="list"></div>
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-top">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-info">
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-date"  id="modal-date"></div>
        <div class="modal-note"  id="modal-note"></div>
      </div>
    </div>

    <div class="modal-sec">📅 캘린더 저장</div>
    <div class="modal-actions">
      <a class="modal-btn" id="btn-google" href="#" target="_blank">
        <div class="modal-btn-icon">📅</div>
        <div>
          <div class="modal-btn-label">Google 캘린더</div>
          <div class="modal-btn-sub">삼성 갤럭시 기본 캘린더와 자동 연동</div>
        </div>
      </a>
      <a class="modal-btn" id="btn-apple" href="#">
        <div class="modal-btn-icon">🍎</div>
        <div>
          <div class="modal-btn-label">Apple 캘린더</div>
          <div class="modal-btn-sub">.ics 다운로드 → iPhone / iPad에서 바로 열기</div>
        </div>
      </a>
    </div>

    <div class="modal-sec">📝 메모 저장</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="openSamsungNote()">
        <div class="modal-btn-icon">🗒️</div>
        <div>
          <div class="modal-btn-label">삼성 노트에 저장</div>
          <div class="modal-btn-sub">복사 후 삼성 노트 앱으로 이동</div>
        </div>
      </button>
      <button class="modal-btn" onclick="shareNative()">
        <div class="modal-btn-icon">📤</div>
        <div>
          <div class="modal-btn-label">공유하기</div>
          <div class="modal-btn-sub">카카오톡 · 문자 · 네이버 메모 등</div>
        </div>
      </button>
      <button class="modal-btn" onclick="copyToClipboard()">
        <div class="modal-btn-icon">📋</div>
        <div>
          <div class="modal-btn-label">클립보드 복사</div>
          <div class="modal-btn-sub">원하는 앱에 붙여넣기</div>
        </div>
      </button>
    </div>

    <button class="modal-cancel" onclick="closeModal()">닫기</button>
  </div>
</div>

<script>
const schedules = [
  // 9월
  { month:9, day:6,    service:"국수봉사",  emoji:"🍜", note:"주일",              dateLabel:"9월 6일",    startDate:"20260906" },
  { month:9, day:null, service:"엘리스카페", emoji:"☕", note:"9월 담당 · 3주",   dateLabel:"9월",        startDate:"20260901", endDate:"20260930",
    details:[ { date:"9월 5일", group:"충성1속" }, { date:"9월 12일", group:"충성2속" }, { date:"9월 19일", group:"충성3속" } ] },
  // 10월
  { month:10, day:null, service:"헌금위원",  emoji:"💰", note:"10월 전체 (주일)", dateLabel:"10월 전체", startDate:"20261004", endDate:"20261025" },
  { month:10, day:17,   service:"이동목욕",  emoji:"🛁", note:"토요일 · 화평3속 · 화평2속 · 화평1속 · 희락4속", dateLabel:"10월 17일",  startDate:"20261017" },
  { month:10, day:null, service:"성전청소",  emoji:"🧹", note:"토요일",            dateLabel:"10월",       startDate:"20261003" },
  // 11월
  { month:11, day:null, service:"엘리스카페", emoji:"☕", note:"11월 담당 · 4주",  dateLabel:"11월",       startDate:"20261101", endDate:"20261130",
    details:[ { date:"11월 7일", group:"사랑3속" }, { date:"11월 21일", group:"온유1속" }, { date:"11월 21일", group:"온유2속" }, { date:"11월 28일", group:"온유3속" } ] },
];

const emoji = { 국수봉사:"🍜", 헌금위원:"💰", 이동목욕:"🛁", 성전청소:"🧹", 엘리스카페:"☕" };
let currentItem = null;

function render() {
  const months = [...new Set(schedules.map(s => s.month))];
  let html = '';
  months.forEach(m => {
    const items = schedules.filter(s => s.month === m);
    html += `
    <div class="section">
      <div class="section-header">
        <div class="section-month">${m}월</div>
        <div class="section-dot"></div>
        <div class="section-count">${items.length}건</div>
      </div>`;
    items.forEach(s => {
      const idx = schedules.indexOf(s);
      const hasDetails = s.details && s.details.length > 0;

      let detailHtml = '';
      if (hasDetails) {
        const rows = s.details.map(d => `
          <div class="detail-row">
            <div class="detail-date">${d.date}</div>
            <div class="detail-group dg-${s.service}">${d.group}</div>
          </div>`).join('');
        detailHtml = `<div class="detail-wrap" id="detail-${idx}">${rows}</div>`;
      }

      const hintBadge = hasDetails
        ? `<div class="expand-hint">▾ 세부 일정 보기</div>` : '';

      html += `
      <div class="card ${hasDetails ? 'has-detail' : ''}" onclick="${hasDetails ? `toggleDetail(${idx})` : `openModal(${idx})`}">
        <div class="card-inner">
          <div class="card-accent c-${s.service}"></div>
          <div class="card-body">
            <div class="card-icon-wrap ic-${s.service}">${s.emoji}</div>
            <div class="card-info">
              <div class="card-service t-${s.service}">${s.service}</div>
              <div class="card-date">${s.dateLabel}</div>
              <div class="card-note-wrap">
                <div class="card-note">${s.note}</div>
                ${hintBadge}
              </div>
            </div>
            <div class="card-arrow" id="arrow-${idx}">${hasDetails ? '∨' : '›'}</div>
          </div>
        </div>
        ${detailHtml}
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('list').innerHTML = html;
}

function toggleDetail(idx) {
  const wrap  = document.getElementById(`detail-${idx}`);
  const arrow = document.getElementById(`arrow-${idx}`);
  const isOpen = wrap.classList.toggle('open');
  arrow.textContent = isOpen ? '∧' : '∨';
}

function openModal(idx) {
  currentItem = schedules[idx];
  const s = currentItem;
  document.getElementById('modal-icon').textContent  = s.emoji;
  document.getElementById('modal-title').textContent = s.service;
  document.getElementById('modal-date').textContent  = `📅 ${s.dateLabel}`;
  document.getElementById('modal-note').textContent  = `📌 ${s.note}`;

  // Google Calendar
  const title   = encodeURIComponent(`[7교구] ${s.service}`);
  const details = encodeURIComponent(`2026 하반기 교회 봉사 - 7교구 ${s.service}\n${s.note}`);
  const isAllDay = !s.day;
  const gStart  = isAllDay ? s.startDate : s.startDate + 'T090000';
  const gEnd    = isAllDay ? (s.endDate||s.startDate) : s.startDate + 'T120000';
  document.getElementById('btn-google').href =
    `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${gStart}/${gEnd}&details=${details}`;

  // Apple .ics
  const ics  = generateICS(s);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.getElementById('btn-apple');
  if (a._prev) URL.revokeObjectURL(a._prev);
  a._prev = url; a.href = url;
  a.download = `7교구_${s.service}_${s.dateLabel}.ics`;

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function generateICS(s) {
  const now = new Date().toISOString().replace(/[-:.]/g,'').slice(0,15)+'Z';
  const isAllDay = !s.day;
  const dtstart = isAllDay ? `DTSTART;VALUE=DATE:${s.startDate}` : `DTSTART:${s.startDate}T090000`;
  const dtend   = isAllDay ? `DTEND;VALUE=DATE:${s.endDate||s.startDate}` : `DTEND:${s.startDate}T120000`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//7교구봉사//KR',
    'BEGIN:VEVENT',`UID:7gyo-${s.startDate}-${s.service}@church`,
    `DTSTAMP:${now}`,dtstart,dtend,
    `SUMMARY:[7교구] ${s.service}`,
    `DESCRIPTION:2026 하반기 교회 봉사 - 7교구 ${s.service}\\n${s.note}`,
    'LOCATION:교회','BEGIN:VALARM','TRIGGER:-PT1D','ACTION:DISPLAY',
    `DESCRIPTION:내일 7교구 ${s.service} 봉사일입니다`,
    'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function getMemoText() {
  const s = currentItem;
  return `📌 7교구 하반기 봉사 일정\n━━━━━━━━━━━━━━\n${s.emoji} 봉사 : ${s.service}\n📅 날짜 : ${s.dateLabel}\n📋 비고 : ${s.note}\n━━━━━━━━━━━━━━\n2026년도 교회 봉사표`;
}
function openSamsungNote() {
  navigator.clipboard.writeText(getMemoText()).then(() => {
    showToast('📋 복사 완료! 삼성 노트를 열어 붙여넣기 해주세요');
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = 'samsung-notes://create';
      a.style.display = 'none';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }, 600);
  });
}
function shareNative() {
  const s = currentItem;
  if (navigator.share) {
    navigator.share({ title:`[7교구] ${s.service}`, text:getMemoText() }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(getMemoText()).then(() => showToast('📋 복사 완료!'));
  }
}
function copyToClipboard() {
  navigator.clipboard.writeText(getMemoText()).then(() => showToast('✅ 클립보드에 복사됐습니다'));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}
function closeModalOutside(e) {
  if (e.target.id === 'modal') closeModal();
}

render();
</script>
</body>
</html>
